# FUTURE TEMPLATE ONLY: no verified out/ exists yet. Review TLS/CSP/paths upstream.
# Place inside a reviewed TLS server block. The API owns authorization.
root /srv/brokerage-release/frontend;
index index.html;
autoindex off;
location = /site-bootstrap.json {
  add_header Cache-Control "no-store" always;
  try_files $uri =404;
}
location = /api { return 308 /api/; }
location ^~ /api/ {
  proxy_pass http://127.0.0.1:5000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # Tune streaming/timeouts/body limits to the reviewed backend contract.
}
location ^~ /_next/static/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}
location / {
  # Preserve missing-route errors; no catch-all success for unexported runtime IDs.
  try_files $uri $uri.html $uri/index.html =404;
}
# NEVER alias the brokerage private inspection-media root.
# Bootstrap/public settings/auth/private APIs must bypass any future SW shell cache.
